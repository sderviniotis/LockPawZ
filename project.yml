name: Lockpaw
options:
  bundleIdPrefix: com.sderviniotis
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Steve's Personal Team (free Apple ID). Kept here so `xcodegen generate` never
    # drops it: an ad-hoc signed build makes macOS re-ask for Accessibility on every
    # rebuild, and other Macs treat it as an unidentified developer.
    DEVELOPMENT_TEAM: JRA488C74T

schemes:
  Lockpaw:
    build:
      targets:
        Lockpaw: all
        LockpawTests: [test]
    test:
      targets:
        - LockpawTests

targets:
  Lockpaw:
    type: application
    platform: macOS
    sources:
      - path: Lockpaw
    settings:
      base:
        PRODUCT_NAME: LockPawZ
        # The Swift module keeps the upstream name so `@testable import Lockpaw` and every
        # type reference stay as they are; only the app on disk is called LockPawZ.
        PRODUCT_MODULE_NAME: Lockpaw
        PRODUCT_BUNDLE_DISPLAY_NAME: LockPawZ
        INFOPLIST_FILE: Lockpaw/Info.plist
        CODE_SIGN_ENTITLEMENTS: Lockpaw/Lockpaw.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The control accent: a deeper Lockpaw teal, because brand teal (#00D4AA) can't carry
        # white text (1.9:1 on a selected segment or a default button). #008A6E gives 4.3:1,
        # better than system blue. macOS uses it when the user's accent is Multicolor.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: LockpawAccent
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.sderviniotis.lockpawz.debug
          PRODUCT_BUNDLE_DISPLAY_NAME: LockPawZ Debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.sderviniotis.lockpawz
    dependencies:
      - target: LockpawCLI
        embed: true
        copy:
          # SharedSupport, not MacOS — `lockpaw` would collide with the app binary
          # `Lockpaw` on case-insensitive filesystems (DMG/Applications).
          destination: sharedSupport
  LockpawCLI:
    type: tool
    platform: macOS
    sources:
      - path: LockpawCLI
      # Shared with the app so the ping wire format and the hook merge have one
      # definition, and the app's unit tests cover what the CLI runs.
      - path: Lockpaw/Models/AgentPing.swift
      - path: Lockpaw/Models/AgentHookConfig.swift
    settings:
      base:
        PRODUCT_NAME: lockpaw
        # Module name must NOT case-collide with the app's `Lockpaw` module — on a
        # case-insensitive filesystem `lockpaw.swiftmodule` and `Lockpaw.swiftmodule`
        # clash and break `@testable import Lockpaw`. Executable stays `lockpaw`.
        PRODUCT_MODULE_NAME: LockpawCLI
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  LockpawTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LockpawTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sderviniotis.lockpawz.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LockPawZ.app/Contents/MacOS/LockPawZ"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Lockpaw
